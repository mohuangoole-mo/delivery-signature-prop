<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宅配簽收</title>
<style>
/* layout: courier waybill aesthetic — black/caution-yellow header with hazard stripe, kraft-paper surface, barcode + perforated ticket motifs, red ink stamp on completion */
/* this screen always renders in the same paper-and-ink look, regardless of
   the viewer's light/dark setting — it's a filming prop and must look
   identical every time it's opened on set */
:root {
  --bg: #f4ede0;
  --surface: #fffdf7;
  --ink: #1d1a12;
  --ink-dim: #7a7261;
  --line: #e2d8c2;
  --accent: #ffc82c;
  --accent-ink: #1d1a12;
  --rule: #1d1a12;
  --stamp: #c4342b;
  --font-display: 'Archivo Black', 'Noto Sans TC', sans-serif;
  --font-body: 'Noto Sans TC', 'Barlow', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body {
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  margin: 0;
  overflow: hidden;
}
.app-shell {
  max-width: 460px;
  margin-inline: auto;
  height: 100%;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.statusbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.03em;
  padding: 4px 16px;
  border-bottom: 1.5px solid var(--rule);
}
.statusbar .battery {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  opacity: 0.8;
}
.statusbar .battery .cell {
  width: 18px;
  height: 9px;
  border: 1px solid currentColor;
  border-radius: 2px;
  position: relative;
}
.statusbar .battery .cell::after {
  content: '';
  position: absolute;
  inset: 1px;
  width: 70%;
  background: currentColor;
  border-radius: 1px;
}

.hazard {
  flex: none;
  height: 5px;
  background: repeating-linear-gradient(
    -45deg,
    var(--rule) 0 10px,
    var(--accent) 10px 20px
  );
}

.scroll-area {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
#form-screen {
  flex: 1;
  min-height: 0;
  padding-inline: 16px;
  padding-block: 12px 4px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#done-screen {
  flex: 1;
  min-height: 0;
  padding-inline: 16px;
  padding-block: 16px 20px;
  justify-content: center;
}

.app-header {
  flex: none;
  background: var(--surface);
  color: var(--ink);
  padding: 8px 16px 7px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: relative;
  overflow: hidden;
  border-bottom: 2px solid var(--rule);
}
.app-header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent 0 24px,
    rgba(255, 200, 44, 0.16) 24px 26px
  );
  pointer-events: none;
}
.app-header .top-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.app-header .eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--stamp);
}
.app-header .badge {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink-dim);
}
.app-header h1 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 400;
  margin: 0;
  letter-spacing: 0.01em;
  color: var(--ink);
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.card {
  background: var(--surface);
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  padding: 12px;
  position: relative;
}
.card::before {
  content: '';
  position: absolute;
  left: 14px;
  right: 14px;
  top: -1.5px;
  height: 0;
  border-top: 2px dashed var(--line);
}
.card.sig-card::before { display: none; }
.card .ticket-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin: 0 0 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card .ticket-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

.field-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.field label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.field input {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  background: transparent;
  border: none;
  border-bottom: 2px dotted var(--line);
  padding: 2px 2px;
  width: 100%;
}
.field input:focus {
  outline: none;
  border-bottom-color: var(--stamp);
  border-bottom-style: solid;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.sig-card {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.sig-card h2 {
  flex: none;
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 400;
  margin: 0 0 2px;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.sig-card .hint {
  flex: none;
  font-size: 12px;
  color: var(--ink-dim);
  margin: 0 0 6px;
}
.sig-wrap {
  flex: 1;
  min-height: 60px;
  position: relative;
  border: 2px solid var(--rule);
  border-radius: 6px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--line) 39px 40px);
  background-position: 0 60%;
  overflow: hidden;
  touch-action: none;
}
.sig-wrap::after {
  content: 'X';
  position: absolute;
  left: 10px;
  bottom: 10px;
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--ink-dim);
  font-size: 14px;
  pointer-events: none;
}
.sig-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}
.sig-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-dim);
  font-size: 13px;
  pointer-events: none;
  transition: opacity 120ms ease-out;
}
.sig-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.linkbtn {
  background: none;
  border: none;
  color: var(--stamp);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 6px 4px;
  cursor: pointer;
}
.linkbtn:focus-visible { outline: 2px solid var(--stamp); border-radius: 4px; }

.confirm-bar {
  position: sticky;
  bottom: 0;
  padding-top: 6px;
  padding-bottom: 8px;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
.confirm-btn {
  width: 100%;
  border: 2px solid var(--rule);
  border-radius: 8px;
  padding: 15px;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--rule);
  transition: transform 100ms ease-out, box-shadow 100ms ease-out, opacity 120ms ease-out;
}
.confirm-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--rule); }
.confirm-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  box-shadow: none;
}
.confirm-btn:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }

/* done state */
.done-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 16px;
  padding-block: 24px 8px;
}
.stamp {
  width: 128px;
  height: 128px;
  border-radius: 50%;
  border: 4px solid var(--stamp);
  outline: 1.5px solid var(--stamp);
  outline-offset: -8px;
  color: var(--stamp);
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-9deg);
  animation: stamp-in 320ms cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
  mix-blend-mode: multiply;
}
.stamp .stamp-text {
  font-family: var(--font-display);
  font-size: 19px;
  line-height: 1.15;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.stamp .stamp-text small {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  margin-top: 2px;
}
@keyframes stamp-in {
  from { opacity: 0; transform: rotate(-9deg) scale(1.6); }
  to { opacity: 1; transform: rotate(-9deg) scale(1); }
}
.done-screen h2 {
  font-family: var(--font-display);
  font-size: 24px;
  margin: 0;
  text-transform: uppercase;
}
.done-screen p {
  margin: 0;
  color: var(--ink-dim);
  font-size: 13px;
  max-width: 30ch;
}
.receipt {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
}
.receipt .row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
}
.receipt .row span:first-child { color: var(--ink-dim); }
.receipt .row span:last-child { font-family: var(--font-mono); text-align: right; }
.receipt .sig-preview {
  border-top: 1px dashed var(--line);
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.receipt .sig-preview span { color: var(--ink-dim); font-size: 11px; }
.receipt img { max-width: 100%; height: 56px; object-fit: contain; object-position: left center; }

.reset-btn {
  width: 100%;
  border: 1.5px dashed var(--line);
  border-radius: 8px;
  padding: 13px;
  background: transparent;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.03em;
  cursor: pointer;
}
.reset-btn:active { transform: scale(0.99); }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .stamp { animation: none; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
</head>
<body>
<div class="app-shell">
  <div class="statusbar">
    <span id="clock">09:41</span>
    <span class="battery"><span class="cell"></span>行動簽收終端</span>
  </div>

  <div class="hazard" aria-hidden="true"></div>

  <div class="app-header">
    <div class="top-row">
      <span class="eyebrow">Proof of Delivery</span>
      <span class="badge">No. 04</span>
    </div>
    <h1>包裹簽收單</h1>
  </div>

  <div class="scroll-area">
    <section id="form-screen">
      <div class="card">
        <p class="ticket-label">託運單資訊</p>
        <div class="field-grid">
          <div class="field-row">
            <div class="field">
              <label for="f-tracking">配送單號</label>
              <input id="f-tracking" type="text" inputmode="text" value="TW4112604110" />
            </div>
            <div class="field">
              <label for="f-date">配送日期</label>
              <input id="f-date" type="text" inputmode="text" value="2026/11/04" />
            </div>
          </div>
          <div class="field">
            <label for="f-recipient">收件人</label>
            <input id="f-recipient" type="text" inputmode="text" value="陳先生" />
          </div>
          <div class="field">
            <label for="f-item">品項</label>
            <input id="f-item" type="text" inputmode="text" value="家用日常用品" />
          </div>
        </div>
      </div>

      <div class="card sig-card">
        <h2>收件確認簽名</h2>
        <p class="hint">請收件人於下方欄位用手指簽名，以確認已收到包裹。</p>
        <div class="sig-wrap">
          <canvas id="sig-canvas"></canvas>
          <div class="sig-placeholder" id="sig-placeholder">在這裡簽名</div>
        </div>
        <div class="sig-actions">
          <button class="linkbtn" id="clear-btn" type="button">清除重簽</button>
        </div>
      </div>

      <div class="confirm-bar">
        <button class="confirm-btn" id="confirm-btn" type="button" disabled>確認簽收</button>
      </div>
    </section>

    <section id="done-screen" class="done-screen" hidden>
      <div class="stamp" aria-hidden="true">
        <span class="stamp-text">送達<br>簽收<small>DELIVERED</small></span>
      </div>
      <h2>簽收完成</h2>
      <p>包裹已確認送達，簽名已留存於本次簽收紀錄。</p>

      <div class="receipt">
        <div class="row"><span>配送單號</span><span id="r-tracking"></span></div>
        <div class="row"><span>配送日期</span><span id="r-date"></span></div>
        <div class="row"><span>收件人</span><span id="r-recipient"></span></div>
        <div class="row"><span>品項</span><span id="r-item"></span></div>
        <div class="row"><span>簽收時間</span><span id="r-time"></span></div>
        <div class="sig-preview">
          <span>收件人簽名</span>
          <img id="r-sig-img" alt="收件人簽名" />
        </div>
      </div>

      <button class="reset-btn" id="reset-btn" type="button">清除並重新簽收（下一次拍攝）</button>
    </section>
  </div>
</div>

<script>
(function () {
  'use strict';

  var clockEl = document.getElementById('clock');
  function tick() {
    try {
      var d = new Date();
      var h = String(d.getHours()).padStart(2, '0');
      var m = String(d.getMinutes()).padStart(2, '0');
      clockEl.textContent = h + ':' + m;
    } catch (e) {}
  }
  tick();
  setInterval(tick, 15000);

  var canvas = document.getElementById('sig-canvas');
  var ctx = canvas.getContext('2d');
  var placeholder = document.getElementById('sig-placeholder');
  var confirmBtn = document.getElementById('confirm-btn');
  var clearBtn = document.getElementById('clear-btn');
  var hasInk = false;
  var drawing = false;
  var last = null;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    var prev = hasInk ? canvas.toDataURL() : null;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    strokeStyle();
    if (prev) {
      var img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 0, 0, rect.width, rect.height);
      };
      img.src = prev;
    }
  }

  function strokeStyle() {
    var ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1b2420';
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function pointFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var touch = (e.touches && e.touches[0]) || e;
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing = true;
    last = pointFromEvent(e);
    if (!hasInk) {
      hasInk = true;
      placeholder.style.opacity = '0';
      confirmBtn.disabled = false;
    }
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    var p = pointFromEvent(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }
  function end(e) {
    drawing = false;
    last = null;
  }

  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  clearBtn.addEventListener('click', function () {
    var rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    hasInk = false;
    placeholder.style.opacity = '1';
    confirmBtn.disabled = true;
  });

  var formScreen = document.getElementById('form-screen');
  var doneScreen = document.getElementById('done-screen');
  var resetBtn = document.getElementById('reset-btn');

  confirmBtn.addEventListener('click', function () {
    if (!hasInk) return;

    document.getElementById('r-tracking').textContent = document.getElementById('f-tracking').value;
    document.getElementById('r-date').textContent = document.getElementById('f-date').value;
    document.getElementById('r-recipient').textContent = document.getElementById('f-recipient').value;
    document.getElementById('r-item').textContent = document.getElementById('f-item').value;

    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('r-time').textContent = hh + ':' + mm;

    document.getElementById('r-sig-img').src = canvas.toDataURL('image/png');

    formScreen.hidden = true;
    doneScreen.hidden = false;
  });

  resetBtn.addEventListener('click', function () {
    var rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    hasInk = false;
    placeholder.style.opacity = '1';
    confirmBtn.disabled = true;
    formScreen.hidden = false;
    doneScreen.hidden = true;
  });
})();
</script>
</body>
</html>
